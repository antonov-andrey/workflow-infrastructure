          Location: !Sub s3://${DataBucket}/user_22222222222242228222222222222222/
          NumberOfBuckets: -1
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            Parameters:
              serialization.format: '1'
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
          StoredAsSubDirectories: false
        TableType: EXTERNAL_TABLE

  PlatformRoleTablePermission:
    Type: AWS::LakeFormation::PrincipalPermissions
    DependsOn:
      - UserATable
      - UserBTable
    Properties:
      Permissions:
        - ALL
      PermissionsWithGrantOption:
        - ALL
      Principal:
        DataLakePrincipalIdentifier: !GetAtt PlatformRole.Arn
      Resource:
        Table:
          CatalogId: !Ref AWS::AccountId
          DatabaseName: !Ref GlueDatabase
          TableWildcard: {}

  QueryRoleDatabasePermission:
    Type: AWS::LakeFormation::PrincipalPermissions
    Properties:
      Permissions:
        - DESCRIBE
      PermissionsWithGrantOption: []
      Principal:
        DataLakePrincipalIdentifier: !GetAtt QueryRole.Arn
      Resource:
        Database:
          CatalogId: !Ref AWS::AccountId
          Name: !Ref GlueDatabase

  QueryRoleTablePermission:
    Type: AWS::LakeFormation::PrincipalPermissions
    DependsOn:
      - UserATable
      - UserBTable
    Properties:
