          CatalogId: !Ref AWS::AccountId
          DatabaseName: !Ref GlueDatabase
          TableWildcard: {}

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Description: Workflow Control Center development tenant queries.
      Name: !If
        - IsPrimaryEnvironment
        - workflow-data
        - !Sub workflow-data-${EnvironmentName}
      RecursiveDeleteOption: true
      State: ENABLED
      Tags:
        - Key: Name
          Value: workflow-control-center-development
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      WorkGroupConfiguration:
        BytesScannedCutoffPerQuery: 104857600
        EnforceWorkGroupConfiguration: true
        EngineVersion:
          SelectedEngineVersion: AUTO
        PublishCloudWatchMetricsEnabled: true
        RequesterPaysEnabled: false

  AthenaDailyScannedBytesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Athena workgroup scanned at least 1 TiB during one day.
      AlarmName: !If
        - IsPrimaryEnvironment
        - workflow-data-daily-scanned-byte-count
        - !Sub workflow-data-${EnvironmentName}-daily-scanned-byte-count
      ComparisonOperator: GreaterThanOrEqualToThreshold
      DatapointsToAlarm: 1
      Dimensions:
        - Name: WorkGroup
          Value: !Ref AthenaWorkGroup
      EvaluationPeriods: 1
      MetricName: ProcessedBytes
      Namespace: AWS/Athena
      Period: 86400
      Statistic: Sum
      Tags:
        - Key: Name
          Value: workflow-data-daily-scanned-byte-count
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      Threshold: 1099511627776
      TreatMissingData: notBreaching
      Unit: Bytes

  AthenaFailedQueryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Athena workgroup produced at least one failed query during five minutes.
      AlarmName: !If
        - IsPrimaryEnvironment
        - workflow-data-failed-query-count
        - !Sub workflow-data-${EnvironmentName}-failed-query-count
      ComparisonOperator: GreaterThanOrEqualToThreshold
      DatapointsToAlarm: 1
      Dimensions:
        - Name: QueryState
          Value: FAILED
        - Name: WorkGroup
          Value: !Ref AthenaWorkGroup
      EvaluationPeriods: 1
      MetricName: TotalExecutionTime
      Namespace: AWS/Athena
      Period: 300
      Statistic: SampleCount
      Tags:
        - Key: Name
          Value: workflow-data-failed-query-count
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      Threshold: 1
      TreatMissingData: notBreaching

Outputs:
  AccountId:
    Value: !Ref AWS::AccountId
  EnvironmentName:
    Value: !Ref EnvironmentName
  AthenaQueryRoleArn:
    Value: !GetAtt QueryRole.Arn
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
  DataBucketName:
    Value: !Ref DataBucket
  DataCredentialRoleArn:
    Value: !GetAtt DataCredentialRole.Arn
  GlueDatabaseName:
    Value: !Ref GlueDatabase
  LakeFormationDataAccessRoleArn:
    Value: !GetAtt LakeFormationDataAccessRole.Arn
  ObservabilityBucketName:
    Value: !Ref ObservabilityBucket
  PlatformRoleArn:
    Value: !GetAtt PlatformRole.Arn
  PlatformRoleName:
    Value: !Ref PlatformRole
  Region:
    Value: !Ref AWS::Region
  ResultBucketName:
    Value: !Ref ResultBucket
  SecretBucketName:
    Value: !Ref SecretBucket
  StorageKmsKeyArn:
    Value: !GetAtt StorageKmsKey.Arn
  VpnValidationHttpsUrl:
    Value: !Sub https://${VpnValidationRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${VpnValidationStage}/ip
  UserADataRootId:
    Value: 11111111-1111-4111-8111-111111111111
  UserATableName:
    Value: user_11111111111141118111111111111111__acceptance__fixture__v1
  UserBDataRootId:
    Value: 22222222-2222-4222-8222-222222222222
  UserBTableName:
    Value: user_22222222222242228222222222222222__acceptance__fixture__v1
