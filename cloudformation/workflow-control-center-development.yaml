AWSTemplateFormatVersion: '2010-09-09'
Description: Workflow Control Center development data plane in us-east-1.

Parameters:
  EnvironmentName:
    Type: String
    Default: primary
    AllowedPattern: '[a-z][a-z0-9]{0,15}'
    Description: Stable development environment identity.

  DeploymentPrincipalArn:
    Type: String
    Default: arn:aws:iam::463564115167:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_AdministratorAccess_96adc54d23890b23
    Description: Exact IAM Identity Center administrator role allowed to assume the platform role and administer Lake Formation.

  NotificationTagValue:
    Type: String
    Default: workflow-control-center
    AllowedPattern: '[a-z0-9-]+'
    Description: Stable project tag value.

  UiOrigin:
    Type: String
    Default: http://localhost:8080
    Description: Browser origin allowed to use direct S3 credentials.

Conditions:
  IsPrimaryEnvironment: !Equals [!Ref EnvironmentName, primary]

Resources:
  AccountPublicAccessBlock:
    Type: Custom::S3AccountPublicAccessBlock
    DependsOn: AccountPublicAccessBlockFunctionLogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AccountId: !Ref AWS::AccountId
      ServiceToken: !GetAtt AccountPublicAccessBlockFunction.Arn

  AccountPublicAccessBlockFunction:
    Type: AWS::Lambda::Function
    Properties:
      Architectures:
        - arm64
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          _CONFIGURATION = {
              "BlockPublicAcls": True,
              "BlockPublicPolicy": True,
              "IgnorePublicAcls": True,
              "RestrictPublicBuckets": True,
          }


          def handler(event, context):
              account_id = event["ResourceProperties"]["AccountId"]
              physical_id = f"s3-account-public-access-block-{account_id}"
              try:
                  if event["RequestType"] != "Delete":
                      client = boto3.client("s3control")
                      client.put_public_access_block(
                          AccountId=account_id,
                          PublicAccessBlockConfiguration=_CONFIGURATION,
                      )
                      actual = client.get_public_access_block(AccountId=account_id)[
                          "PublicAccessBlockConfiguration"
                      ]
                      if actual != _CONFIGURATION:
                          raise RuntimeError("S3 account public-access block verification failed")
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.SUCCESS,
                      {},
                      physicalResourceId=physical_id,
                  )
              except Exception as error:
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.FAILED,
                      {},
                      physicalResourceId=physical_id,
                      reason=type(error).__name__,
                  )
      Description: Enforce account-level S3 Block Public Access without removing it on stack deletion.
      Handler: index.handler
      MemorySize: 128
      Role: !GetAtt AccountPublicAccessBlockFunctionRole.Arn
      Runtime: python3.14
      Timeout: 30
      Tags:
        - Key: Name
          Value: workflow-control-center-account-public-access-block
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  AccountPublicAccessBlockFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AccountPublicAccessBlockFunction}
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: workflow-control-center-account-public-access-block
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  AccountPublicAccessBlockFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: enforce-account-public-access-block
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetAccountPublicAccessBlock
                  - s3:PutAccountPublicAccessBlock
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*
      Tags:
        - Key: Name
          Value: workflow-control-center-account-public-access-block
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  VpnValidationRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Description: Public controlled HTTPS boundary for VPN egress validation.
      DisableExecuteApiEndpoint: false
      EndpointConfiguration:
        Types:
          - REGIONAL
      Name: !If
        - IsPrimaryEnvironment
        - workflow-control-center-vpn-validation
        - !Sub workflow-control-center-vpn-validation-${EnvironmentName}
      Tags:
        - Key: Name
          Value: workflow-control-center-vpn-validation
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  VpnValidationIpResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt VpnValidationRestApi.RootResourceId
      PathPart: ip
      RestApiId: !Ref VpnValidationRestApi

  VpnValidationGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: GET
      Integration:
        RequestTemplates:
          application/json: '{"statusCode":200}'
        IntegrationResponses:
          - ResponseParameters:
              method.response.header.Cache-Control: "'no-store'"
            ResponseTemplates:
              application/json: '{"ip":"$context.identity.sourceIp"}'
            StatusCode: '200'
        PassthroughBehavior: NEVER
        Type: MOCK
      MethodResponses:
        - ResponseParameters:
            method.response.header.Cache-Control: true
          StatusCode: '200'
      ResourceId: !Ref VpnValidationIpResource
      RestApiId: !Ref VpnValidationRestApi

  VpnValidationDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - VpnValidationGetMethod
    Properties:
      Description: VPN validation HTTPS contract version 1.
      RestApiId: !Ref VpnValidationRestApi

  VpnValidationStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      DeploymentId: !Ref VpnValidationDeployment
      Description: Workflow Control Center development VPN validation endpoint.
      MethodSettings:
        - DataTraceEnabled: false
          HttpMethod: '*'
          LoggingLevel: 'OFF'
          MetricsEnabled: false
          ResourcePath: '/*'
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
      RestApiId: !Ref VpnValidationRestApi
      StageName: development
      Tags:
        - Key: Name
          Value: workflow-control-center-vpn-validation
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  LakeFormationDataAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - workflow-control-center-lake-formation-data-access
        - !Sub workflow-control-center-${EnvironmentName}-lf-data-access
      Description: Lake Formation access to encrypted Workflow Control Center development Data.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLakeFormation
            Effect: Allow
            Principal:
              Service: lakeformation.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: workflow-control-center-lake-formation-data-access
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  StorageKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Workflow Control Center development Data, Secret, and Result encryption.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowLakeFormationDataAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt LakeFormationDataAccessRole.Arn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Resource: '*'
            Condition:
              StringEquals:
                kms:EncryptionContext:aws:s3:arn: !If
                  - IsPrimaryEnvironment
                  - !Sub arn:${AWS::Partition}:s3:::workflow-control-center-devel-${AWS::AccountId}-data
                  - !Sub arn:${AWS::Partition}:s3:::workflow-control-center-${EnvironmentName}-${AWS::AccountId}-data
                kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}
      PendingWindowInDays: 7
      Tags:
        - Key: Name
          Value: workflow-control-center-development
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  StorageKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !If
        - IsPrimaryEnvironment
        - alias/workflow-control-center-development
        - !Sub alias/workflow-control-center-development-${EnvironmentName}
      TargetKeyId: !Ref StorageKmsKey

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - IsPrimaryEnvironment
        - !Sub workflow-control-center-devel-${AWS::AccountId}-data
        - !Sub workflow-control-center-${EnvironmentName}-${AWS::AccountId}-data
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt StorageKmsKey.Arn
              SSEAlgorithm: aws:kms
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - POST
              - PUT
            AllowedOrigins:
              - !Ref UiOrigin
            ExposedHeaders:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
              - x-amz-checksum-sha256
              - x-amz-version-id
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            Prefix: .platform/staging/
            Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: workflow-control-center-development-data
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      VersioningConfiguration:
        Status: Enabled

  SecretBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - IsPrimaryEnvironment
        - !Sub workflow-control-center-devel-${AWS::AccountId}-secret
        - !Sub workflow-control-center-${EnvironmentName}-${AWS::AccountId}-secret
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt StorageKmsKey.Arn
              SSEAlgorithm: aws:kms
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - POST
              - PUT
            AllowedOrigins:
              - !Ref UiOrigin
            ExposedHeaders:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
              - x-amz-checksum-sha256
              - x-amz-version-id
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            Prefix: .platform/staging/
            Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: workflow-control-center-development-secret
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      VersioningConfiguration:
        Status: Enabled

  ResultBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - IsPrimaryEnvironment
        - !Sub workflow-control-center-devel-${AWS::AccountId}-result
        - !Sub workflow-control-center-${EnvironmentName}-${AWS::AccountId}-result
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt StorageKmsKey.Arn
              SSEAlgorithm: aws:kms
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - !Ref UiOrigin
            ExposedHeaders:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
              - x-amz-checksum-sha256
              - x-amz-version-id
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            Prefix: athena-result/
            Status: Enabled
          - Id: ExpireDownloadsAfterTwoDays
            ExpirationInDays: 2
            NoncurrentVersionExpirationInDays: 2
            Prefix: data-download/
            Status: Enabled
          - Id: ExpireAthenaResultsAfterThirtyDays
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 30
            Prefix: athena-result/
            Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: workflow-control-center-development-result
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      VersioningConfiguration:
        Status: Enabled

  ObservabilityBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - IsPrimaryEnvironment
        - !Sub workflow-control-center-devel-${AWS::AccountId}-observability
        - !Sub workflow-control-center-${EnvironmentName}-${AWS::AccountId}-obs
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt StorageKmsKey.Arn
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteSourceMapUploads
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            Prefix: source-map/
            Status: Enabled
          - Id: ExpireSourceMapsAfterThirtyDays
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 30
            Prefix: source-map/
            Status: Enabled
          - Id: RemoveExpiredSourceMapDeleteMarkers
            ExpiredObjectDeleteMarker: true
            Prefix: source-map/
            Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: workflow-control-center-development-observability
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      VersioningConfiguration:
        Status: Enabled

  PlatformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - workflow-control-center-platform
        - !Sub workflow-control-center-platform-${EnvironmentName}
      Description: Full Workflow Control Center control-plane access to its dedicated account.
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowDevelopmentAdministrator
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Ref DeploymentPrincipalArn
          - Sid: AllowDevelopmentCompute
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: workflow-control-center-platform
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  DataCredentialRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - apwid-data-access
        - !Sub apwid-data-access-${EnvironmentName}
      Description: Tenant-tagged direct access to Workflow Control Center Data and Secret.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowTaggedPlatformSession
            Effect: Allow
            Principal:
              AWS: !GetAtt PlatformRole.Arn
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - UserDataRootId
              'Null':
                aws:RequestTag/UserDataRootId: 'false'
              StringLike:
                aws:RequestTag/UserDataRootId: '????????????????????????????????'
      Policies:
        - PolicyName: workflow-data-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StorageBucketLocations
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !GetAtt SecretBucket.Arn
                  - !GetAtt ResultBucket.Arn
              - Sid: DataBucketOwnerList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'user_${aws:PrincipalTag/UserDataRootId}'
                      - 'user_${aws:PrincipalTag/UserDataRootId}/*'
                      - '.platform/staging/user_${aws:PrincipalTag/UserDataRootId}'
                      - '.platform/staging/user_${aws:PrincipalTag/UserDataRootId}/*'
              - Sid: SecretBucketOwnerList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt SecretBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'user_${aws:PrincipalTag/UserDataRootId}/.secret'
                      - 'user_${aws:PrincipalTag/UserDataRootId}/.secret/*'
                      - '.platform/staging/user_${aws:PrincipalTag/UserDataRootId}'
                      - '.platform/staging/user_${aws:PrincipalTag/UserDataRootId}/*'
              - Sid: ResultBucketOwnerList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt ResultBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'athena-result/user_${aws:PrincipalTag/UserDataRootId}'
                      - 'athena-result/user_${aws:PrincipalTag/UserDataRootId}/*'
                      - 'data-download/user_${aws:PrincipalTag/UserDataRootId}'
                      - 'data-download/user_${aws:PrincipalTag/UserDataRootId}/*'
              - Sid: CanonicalDataObjectsRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectAttributes
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionAttributes
                Resource: !Sub '${DataBucket.Arn}/user_${!aws:PrincipalTag/UserDataRootId}/*'
              - Sid: CanonicalSecretObjectsRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectAttributes
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionAttributes
                Resource: !Sub '${SecretBucket.Arn}/user_${!aws:PrincipalTag/UserDataRootId}/.secret/*'
              - Sid: OwnerStagingObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:GetObjectAttributes
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionAttributes
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource:
                  - !Sub '${DataBucket.Arn}/.platform/staging/user_${!aws:PrincipalTag/UserDataRootId}/*'
                  - !Sub '${SecretBucket.Arn}/.platform/staging/user_${!aws:PrincipalTag/UserDataRootId}/*'
              - Sid: OwnerResultObjectsRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectAttributes
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionAttributes
                Resource:
                  - !Sub '${ResultBucket.Arn}/athena-result/user_${!aws:PrincipalTag/UserDataRootId}/*'
                  - !Sub '${ResultBucket.Arn}/data-download/user_${!aws:PrincipalTag/UserDataRootId}/*'
              - Sid: StorageKms
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt StorageKmsKey.Arn
                Condition:
                  StringEquals:
                    kms:EncryptionContext:aws:s3:arn:
                      - !GetAtt DataBucket.Arn
                      - !GetAtt SecretBucket.Arn
                      - !GetAtt ResultBucket.Arn
                    kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}
      Tags:
        - Key: Name
          Value: workflow-control-center-data-access
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  QueryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - workflow-data-workflow_data_000
        - !Sub workflow-data-workflow_data_000_${EnvironmentName}
      Description: Tenant-tagged Athena access for workflow_data_000.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowTaggedPlatformSession
            Effect: Allow
            Principal:
              AWS: !GetAtt PlatformRole.Arn
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - UserDataRootId
              'Null':
                aws:RequestTag/UserDataRootId: 'false'
              StringLike:
                aws:RequestTag/UserDataRootId: '????????????????????????????????'
      Policies:
        - PolicyName: workflow-data-query
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AthenaWorkgroup
                Effect: Allow
                Action:
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:GetWorkGroup
                  - athena:ListQueryExecutions
                  - athena:StartQueryExecution
                  - athena:StopQueryExecution
                Resource: !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}
              - Sid: GlueTenantMetadata
                Effect: Allow
                Action:
                  - glue:BatchGetPartition
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetTableVersion
                  - glue:GetTableVersions
                  - glue:SearchTables
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/user_${!aws:PrincipalTag/UserDataRootId}__*
              - Sid: LakeFormationDataAccess
                Effect: Allow
                Action: lakeformation:GetDataAccess
                Resource: '*'
              - Sid: ResultBucketLocation
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt ResultBucket.Arn
              - Sid: ResultBucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ResultBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'athena-result/user_${aws:PrincipalTag/UserDataRootId}'
                      - 'athena-result/user_${aws:PrincipalTag/UserDataRootId}/*'
              - Sid: ResultObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub '${ResultBucket.Arn}/athena-result/user_${!aws:PrincipalTag/UserDataRootId}/*'
              - Sid: ResultKms
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt StorageKmsKey.Arn
                Condition:
                  StringEquals:
                    kms:EncryptionContext:aws:s3:arn: !GetAtt ResultBucket.Arn
                    kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}
      Tags:
        - Key: Name
          Value: workflow-data-workflow_data_000
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: workflow-control-center
          Value: athena-query

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub ${DataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyUnexpectedResourceAccount
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub ${DataBucket.Arn}/*
            Condition:
              StringNotEquals:
                s3:ResourceAccount: !Ref AWS::AccountId
          - Sid: DenyExplicitNonKmsEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${DataBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyUnexpectedKmsKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${DataBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-aws-kms-key-id: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt StorageKmsKey.Arn
          - Sid: DenyCustomerProvidedEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${DataBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-customer-algorithm: 'false'

  LakeFormationDataAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: workflow-control-center-lake-formation-data-access
      Roles:
        - !Ref LakeFormationDataAccessRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DataBucketReadWrite
            Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
            Resource: !Sub ${DataBucket.Arn}/*
          - Sid: DataBucketList
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: !GetAtt DataBucket.Arn
          - Sid: StorageKms
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Resource: !GetAtt StorageKmsKey.Arn
            Condition:
              StringEquals:
                kms:EncryptionContext:aws:s3:arn: !GetAtt DataBucket.Arn
                kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}

