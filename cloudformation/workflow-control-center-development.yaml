  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Description: Workflow Control Center development tenant queries.
      Name: workflow-data
      RecursiveDeleteOption: true
      State: ENABLED
      Tags:
        - Key: Name
          Value: workflow-control-center-development
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: ManagedBy
          Value: CloudFormation
      WorkGroupConfiguration:
        BytesScannedCutoffPerQuery: 104857600
        EnforceWorkGroupConfiguration: true
        EngineVersion:
          SelectedEngineVersion: AUTO
        PublishCloudWatchMetricsEnabled: true
        RequesterPaysEnabled: false

  AthenaDailyScannedBytesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Athena workgroup scanned at least 1 TiB during one day.
      AlarmName: workflow-data-daily-scanned-byte-count
      ComparisonOperator: GreaterThanOrEqualToThreshold
      DatapointsToAlarm: 1
      Dimensions:
        - Name: WorkGroup
          Value: !Ref AthenaWorkGroup
      EvaluationPeriods: 1
      MetricName: ProcessedBytes
      Namespace: AWS/Athena
      Period: 86400
      Statistic: Sum
      Tags:
        - Key: Name
          Value: workflow-data-daily-scanned-byte-count
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: ManagedBy
          Value: CloudFormation
      Threshold: 1099511627776
      TreatMissingData: notBreaching
      Unit: Bytes

  AthenaFailedQueryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Athena workgroup produced at least one failed query during five minutes.
      AlarmName: workflow-data-failed-query-count
      ComparisonOperator: GreaterThanOrEqualToThreshold
      DatapointsToAlarm: 1
      Dimensions:
        - Name: QueryState
          Value: FAILED
        - Name: WorkGroup
          Value: !Ref AthenaWorkGroup
      EvaluationPeriods: 1
      MetricName: TotalExecutionTime
      Namespace: AWS/Athena
      Period: 300
      Statistic: SampleCount
      Tags:
        - Key: Name
          Value: workflow-data-failed-query-count
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: ManagedBy
          Value: CloudFormation
      Threshold: 1
      TreatMissingData: notBreaching

