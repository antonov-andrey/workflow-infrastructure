  DataLakeSettings:
    Type: AWS::LakeFormation::DataLakeSettings
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Admins:
        - DataLakePrincipalIdentifier: !Ref DeploymentPrincipalArn
      AllowExternalDataFiltering: false
      AllowFullTableExternalDataAccess: false
      CreateDatabaseDefaultPermissions: []
      CreateTableDefaultPermissions: []
      ExternalDataFilteringAllowList: []
      MutationType: REPLACE
      Parameters:
        CROSS_ACCOUNT_VERSION: '4'
      TrustedResourceOwners: []

  DataLakeLocation:
    Type: AWS::LakeFormation::Resource
    DependsOn:
      - DataBucketPolicy
      - DataLakeSettings
      - LakeFormationDataAccessPolicy
    Properties:
      HybridAccessEnabled: false
      ResourceArn: !GetAtt DataBucket.Arn
      RoleArn: !GetAtt LakeFormationDataAccessRole.Arn
      UseServiceLinkedRole: false
      WithFederation: false

  PlatformRoleCatalogPermission:
    Type: AWS::LakeFormation::PrincipalPermissions
    DependsOn: DataLakeSettings
    Properties:
      Permissions:
        - CREATE_DATABASE
      PermissionsWithGrantOption: []
      Principal:
        DataLakePrincipalIdentifier: !GetAtt PlatformRole.Arn
      Resource:
        Catalog: !Ref AWS::AccountId

  PlatformRoleDataLocationPermission:
    Type: AWS::LakeFormation::PrincipalPermissions
    DependsOn: DataLakeLocation
    Properties:
      Permissions:
        - DATA_LOCATION_ACCESS
      PermissionsWithGrantOption: []
      Principal:
        DataLakePrincipalIdentifier: !GetAtt PlatformRole.Arn
      Resource:
        DataLocation:
          CatalogId: !Ref AWS::AccountId
          ResourceArn: !GetAtt DataBucket.Arn

  GlueDatabase:
    Type: AWS::Glue::Database
    DependsOn: DataLakeSettings
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        CreateTableDefaultPermissions: []
        Description: Shared tenant-isolated workflow Data tables
        Name: !If
          - IsPrimaryEnvironment
          - workflow_data_000
          - !Sub workflow_data_000_${EnvironmentName}
        Parameters:
          workflow-control-center: athena-data

  PlatformRoleDatabasePermission:
    Type: AWS::LakeFormation::PrincipalPermissions
    Properties:
      Permissions:
        - ALL
      PermissionsWithGrantOption:
        - ALL
      Principal:
        DataLakePrincipalIdentifier: !GetAtt PlatformRole.Arn
      Resource:
        Database:
          CatalogId: !Ref AWS::AccountId
          Name: !Ref GlueDatabase

  UserATable:
    Type: AWS::Glue::Table
    DependsOn: DataLakeLocation
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Description: Source-declared workflow dataset projected from accepted Data manifests
        Name: user_11111111111141118111111111111111__acceptance__fixture__v1
        Parameters:
          classification: json
          EXTERNAL: 'TRUE'
          workflow-control-center: athena-data
        PartitionKeys:
          - Name: workflow_run_date
            Type: string
        Retention: 0
        StorageDescriptor:
          Columns:
            - Name: value
              Type: string
          Compressed: false
          InputFormat: org.apache.hadoop.hive.ql.io.SymlinkTextInputFormat
          Location: !Sub s3://${DataBucket}/user_11111111111141118111111111111111/
          NumberOfBuckets: -1
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            Parameters:
              serialization.format: '1'
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
          StoredAsSubDirectories: false
        TableType: EXTERNAL_TABLE

  UserBTable:
    Type: AWS::Glue::Table
    DependsOn: DataLakeLocation
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Description: Source-declared workflow dataset projected from accepted Data manifests
        Name: user_22222222222242228222222222222222__acceptance__fixture__v1
        Parameters:
          classification: json
          EXTERNAL: 'TRUE'
          workflow-control-center: athena-data
        PartitionKeys:
          - Name: workflow_run_date
            Type: string
        Retention: 0
        StorageDescriptor:
          Columns:
            - Name: value
