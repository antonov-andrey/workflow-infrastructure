AWSTemplateFormatVersion: '2010-09-09'
Description: Workflow Control Center development EC2 and k3s compute plane in us-east-1.

Parameters:
  EnvironmentName:
    Type: String
    Default: primary
    AllowedPattern: '[a-z][a-z0-9]{0,15}'
    Description: Stable development environment identity.

  Amd64AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Canonical Ubuntu 24.04 LTS amd64 AMI resolved at deployment time.

  Arm64AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
    Description: Canonical Ubuntu 24.04 LTS arm64 AMI resolved at deployment time.

  AwsCliSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'
    Description: Verified SHA-256 of the exact AWS CLI archive.

  AwsCliUrl:
    Type: String
    AllowedPattern: 'https://[A-Za-z0-9._~:/?#\[\]@!&()*+,;=%-]+'
    MaxLength: 384
    Description: Exact versioned AWS CLI archive URL.

  AwsCliVersion:
    Type: String
    AllowedPattern: '2\.[0-9]+\.[0-9]+'
    Description: Exact AWS CLI v2 version resolved for this compute release.

  ComputeArchitecture:
    Type: String
    Default: arm64
    AllowedValues:
      - amd64
      - arm64
    Description: Architecture of the development compute instance and runtime platform.

  DockerBuildxPackageSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'

  DockerBuildxPackageUrl:
    Type: String
    AllowedPattern: 'https://[A-Za-z0-9._~:/?#\[\]@!&()*+,;=%-]+'
    MaxLength: 384

  DockerBuildxPackageVersion:
    Type: String
    AllowedPattern: '[A-Za-z0-9.+:~_-]+'

  DockerCeCliPackageSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'

  DockerCeCliPackageUrl:
    Type: String
    AllowedPattern: 'https://[A-Za-z0-9._~:/?#\[\]@!&()*+,;=%-]+'
    MaxLength: 384

  DockerCeCliPackageVersion:
    Type: String
    AllowedPattern: '[A-Za-z0-9.+:~_-]+'

  DockerCePackageSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'

  DockerCePackageUrl:
    Type: String
    AllowedPattern: 'https://[A-Za-z0-9._~:/?#\[\]@!&()*+,;=%-]+'
    MaxLength: 384

  DockerCePackageVersion:
    Type: String
    AllowedPattern: '[A-Za-z0-9.+:~_-]+'

  DockerContainerdPackageSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'

  DockerContainerdPackageUrl:
    Type: String
    AllowedPattern: 'https://[A-Za-z0-9._~:/?#\[\]@!&()*+,;=%-]+'
    MaxLength: 384

  DockerContainerdPackageVersion:
    Type: String
    AllowedPattern: '[A-Za-z0-9.+:~_-]+'

  DockerSigningKeyFingerprint:
    Type: String
    AllowedPattern: '[0-9A-F]{40}'
    Description: Explicit Docker repository signing trust anchor.

  DockerSigningKeySha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'

  DockerSigningKeyUrl:
    Type: String
    AllowedPattern: 'https://[A-Za-z0-9._~:/?#\[\]@!&()*+,;=%-]+'
    MaxLength: 384

  HelmSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'

  HelmUrl:
    Type: String
    AllowedPattern: 'https://[A-Za-z0-9._~:/?#\[\]@!&()*+,;=%-]+'
    MaxLength: 384

  HelmVersion:
    Type: String
    AllowedPattern: 'v4\.[0-9]+\.[0-9]+'

  HostArtifactManifestGzipBase64:
    Type: String
    AllowedPattern: '[A-Za-z0-9+/=]+'
    MaxLength: 3072
    Description: Canonical compressed immutable host artifact provenance.

  HostArtifactManifestSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'
    Description: SHA-256 of canonical uncompressed host artifact provenance.

  InstanceSlot:
    Type: String
    Default: a
    AllowedValues:
      - a
      - b
    Description: Alternating logical slot used for explicit replacement-instance recovery.

  InstanceLaunchTemplateVersion:
    Type: String
    Default: '1'
    AllowedPattern: '[1-9][0-9]*'
    Description: Exact launch-template version active on the current instance.

  InstanceType:
    Type: String
    Default: m7g.xlarge
    AllowedPattern: '[a-z0-9.]+'
    Description: Approved development compute instance type compatible with ComputeArchitecture.

  K3sVersion:
    Type: String
    AllowedPattern: 'v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+'
    Description: Exact k3s release installed by host bootstrap.

  K3sBinarySha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'
    Description: Exact SHA-256 of the selected k3s binary.

  K3sBinaryUrl:
    Type: String
    AllowedPattern: 'https://[A-Za-z0-9._~:/?#\[\]@!&()*+,;=%-]+'
    MaxLength: 384
    Description: Exact versioned k3s binary URL.

  NotificationTagValue:
    Type: String
    Default: workflow-control-center
    AllowedPattern: '[a-z0-9-]+'
    Description: Stable project tag value.

  PlatformRoleName:
    Type: String
    Default: workflow-control-center-platform
    AllowedPattern: '[A-Za-z0-9+=,.@_-]+'
    Description: Existing data-plane platform role attached to the EC2 instance profile.

  PythonBuild:
    Type: String
    AllowedPattern: '[0-9]{8}'
    Description: Exact python-build-standalone build selected by the resolved uv release.

  PythonSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'

  PythonUrl:
    Type: String
    AllowedPattern: 'https://[A-Za-z0-9._~:/?#\[\]@!&()*+,;=%-]+'
    MaxLength: 384

  PythonVersion:
    Type: String
    AllowedPattern: '3\.14\.[0-9]+'
    Description: Exact patch release resolved from the supported Python 3.14 selector.

  RetainedVolumeSizeGiB:
    Type: Number
    Default: 80
    MinValue: 80
    Description: Size of the encrypted retained Product state volume.

  RetainedVolumeSlot:
    Type: String
    Default: base
    AllowedValues:
      - base
      - a
      - b
    Description: Stable base volume or alternating restored-volume resource slot.

  RetainedVolumeSnapshotId:
    Type: String
    Default: ''
    AllowedPattern: '(^$|^snap-[0-9a-f]+$)'
    Description: Optional exact snapshot used to create a replacement retained volume.

  ReplacementGuardScheduleExpression:
    Type: String
    Default: at(2099-01-01T00:00:00)
    AllowedPattern: 'at\([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\)'
    Description: Exact UTC one-time expression used only while a new instance is being created.

  ReplacementGuardScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues:
      - DISABLED
      - ENABLED
    Description: Explicit replacement guard state; ordinary steady-state value is DISABLED.

  RootVolumeSizeGiB:
    Type: Number
    Default: 100
    MinValue: 100
    Description: Size of the encrypted disposable root and build-cache volume.

  S3GatewayEndpointEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'false'
      - 'true'
    Description: Whether to create the no-hourly-charge S3 gateway endpoint.

  UvSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'

  UvUrl:
    Type: String
    AllowedPattern: 'https://[A-Za-z0-9._~:/?#\[\]@!&()*+,;=%-]+'
    MaxLength: 384

  UvVersion:
    Type: String
    AllowedPattern: '0\.[0-9]+\.[0-9]+'

Rules:
  RetainedVolumeSourceIsConsistent:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - !Equals [!Ref RetainedVolumeSlot, base]
                - !Equals [!Ref RetainedVolumeSnapshotId, '']
            - Fn::And:
                - !Not [!Equals [!Ref RetainedVolumeSlot, base]]
                - !Not [!Equals [!Ref RetainedVolumeSnapshotId, '']]
        AssertDescription: The base slot has no snapshot and restored slots require one exact snapshot.

Conditions:
  IsAmd64: !Equals [!Ref ComputeArchitecture, amd64]
  IsPrimaryEnvironment: !Equals [!Ref EnvironmentName, primary]
  UseRetainedVolumeBase: !Equals [!Ref RetainedVolumeSlot, base]
  UseRetainedVolumeRestoreA: !Equals [!Ref RetainedVolumeSlot, a]
  UseRetainedVolumeRestoreB: !Equals [!Ref RetainedVolumeSlot, b]
  UseS3GatewayEndpoint: !Equals [!Ref S3GatewayEndpointEnabled, 'true']

Resources:
  DevelopmentInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: workflow-control-center-development
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  DevelopmentInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref DevelopmentInternetGateway
      VpcId: !Ref DevelopmentVpc

  DevelopmentRoute:
    Type: AWS::EC2::Route
    DependsOn: DevelopmentInternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DevelopmentInternetGateway
      RouteTableId: !Ref DevelopmentRouteTable

  DevelopmentRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DevelopmentVpc
      Tags:
        - Key: Name
          Value: workflow-control-center-development
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  DevelopmentS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseS3GatewayEndpoint
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:*
            Resource: '*'
      RouteTableIds:
        - !Ref DevelopmentRouteTable
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      Tags:
        - Key: Name
          Value: workflow-control-center-development-s3
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      VpcEndpointType: Gateway
      VpcId: !Ref DevelopmentVpc

  DevelopmentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress-only Workflow Control Center development compute.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Outbound package, image, AWS API, and Product traffic.
          IpProtocol: '-1'
      VpcId: !Ref DevelopmentVpc
      Tags:
        - Key: Name
          Value: workflow-control-center-development
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  DevelopmentSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.70.0.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref DevelopmentVpc
      Tags:
        - Key: Name
          Value: workflow-control-center-development
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  DevelopmentSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DevelopmentRouteTable
      SubnetId: !Ref DevelopmentSubnet

  DevelopmentVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.70.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: workflow-control-center-development
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  HostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !If
        - IsPrimaryEnvironment
        - workflow-control-center-development
        - !Sub workflow-control-center-development-${EnvironmentName}
      Roles:
        - !Ref PlatformRoleName

  RetainedBackupPlan:
    Type: AWS::Backup::BackupPlan
    Condition: IsPrimaryEnvironment
    Properties:
      BackupPlan:
        BackupPlanName: workflow-control-center-development-retained
        BackupPlanRule:
          - CompletionWindowMinutes: 360
            Lifecycle:
              DeleteAfterDays: 7
            RecoveryPointTags:
              Name: workflow-control-center-development-retained-recovery-point
              Project: !Ref NotificationTagValue
              Environment: development
              EnvironmentName: primary
              ManagedBy: AWSBackup
            RuleName: daily-retained-volume
            ScheduleExpression: cron(0 3 * * ? *)
            ScheduleExpressionTimezone: UTC
            StartWindowMinutes: 60
            TargetBackupVault: !Ref RetainedBackupVault
      BackupPlanTags:
        Name: workflow-control-center-development-retained
        Project: !Ref NotificationTagValue
        Environment: development
        EnvironmentName: primary
        ManagedBy: CloudFormation

  RetainedBackupRole:
    Type: AWS::IAM::Role
    Condition: IsPrimaryEnvironment
    Properties:
      RoleName: workflow-control-center-development-aws-backup
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
      Tags:
        - Key: Name
          Value: workflow-control-center-development-aws-backup
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: primary
        - Key: ManagedBy
          Value: CloudFormation

  RetainedBackupSelection:
    Type: AWS::Backup::BackupSelection
    Condition: IsPrimaryEnvironment
    Properties:
      BackupPlanId: !Ref RetainedBackupPlan
      BackupSelection:
        IamRoleArn: !GetAtt RetainedBackupRole.Arn
        Resources:
          - !Sub
            - arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/${SelectedVolumeId}
            - SelectedVolumeId: !If
                - UseRetainedVolumeBase
                - !Ref RetainedVolume
                - !If
                  - UseRetainedVolumeRestoreA
                  - !Ref RetainedVolumeRestoreA
                  - !Ref RetainedVolumeRestoreB
        SelectionName: primary-retained-volume

  RetainedBackupVault:
    Type: AWS::Backup::BackupVault
    Condition: IsPrimaryEnvironment
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: workflow-control-center-development-retained
      BackupVaultTags:
        Name: workflow-control-center-development-retained
        Project: !Ref NotificationTagValue
        Environment: development
        EnvironmentName: primary
        ManagedBy: CloudFormation

  RetainedVolume:
    Type: AWS::EC2::Volume
    Condition: UseRetainedVolumeBase
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt DevelopmentSubnet.AvailabilityZone
      Encrypted: true
      Size: !Ref RetainedVolumeSizeGiB
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: workflow-control-center-development-retained
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - IsPrimaryEnvironment
          - Key: workflow-control-center-regular-backup
            Value: primary
          - !Ref AWS::NoValue

  RetainedVolumeRestoreA:
    Type: AWS::EC2::Volume
    Condition: UseRetainedVolumeRestoreA
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt DevelopmentSubnet.AvailabilityZone
      Encrypted: true
      Size: !Ref RetainedVolumeSizeGiB
      SnapshotId: !Ref RetainedVolumeSnapshotId
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: workflow-control-center-development-retained
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - IsPrimaryEnvironment
          - Key: workflow-control-center-regular-backup
            Value: primary
          - !Ref AWS::NoValue

  RetainedVolumeRestoreB:
    Type: AWS::EC2::Volume
    Condition: UseRetainedVolumeRestoreB
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt DevelopmentSubnet.AvailabilityZone
      Encrypted: true
      Size: !Ref RetainedVolumeSizeGiB
      SnapshotId: !Ref RetainedVolumeSnapshotId
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: workflow-control-center-development-retained
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - IsPrimaryEnvironment
          - Key: workflow-control-center-regular-backup
            Value: primary
          - !Ref AWS::NoValue

  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - workflow-control-center-development-scheduler
        - !Sub workflow-control-center-development-${EnvironmentName}-scheduler
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: workflow-control-center-development-invoke-stop-lease
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt LeaseStopFunction.Arn
      Tags:
        - Key: Name
          Value: workflow-control-center-development-scheduler
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  LeaseStopFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !If
        - IsPrimaryEnvironment
        - /aws/lambda/workflow-control-center-development-stop-current-instance
        - !Sub /aws/lambda/workflow-control-center-${EnvironmentName}-stop-instance
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: workflow-control-center-development-stop-current-instance
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  LeaseStopFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - workflow-control-center-development-stop-current-instance
        - !Sub workflow-control-center-${EnvironmentName}-stop-instance
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: workflow-control-center-development-stop-current-instance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ec2:ResourceTag/Environment: development
                    ec2:ResourceTag/EnvironmentName: !Ref EnvironmentName
                    ec2:ResourceTag/ManagedBy: CloudFormation
                    ec2:ResourceTag/Project: !Ref NotificationTagValue
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LeaseStopFunctionLogGroup.Arn
      Tags:
        - Key: Name
          Value: workflow-control-center-development-stop-current-instance
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  LeaseStopFunction:
    Type: AWS::Lambda::Function
    DependsOn: LeaseStopFunctionLogGroup
    Properties:
      FunctionName: !If
        - IsPrimaryEnvironment
        - workflow-control-center-development-stop-current-instance
        - !Sub workflow-control-center-${EnvironmentName}-stop-instance
      Architectures:
        - arm64
      Code:
        ZipFile: |
          import os

          import boto3


          def handler(event, context):
              del event, context
              ec2 = boto3.client("ec2")
              response = ec2.describe_instances(
                  Filters=[
                      {
                          "Name": "tag:aws:cloudformation:stack-name",
                          "Values": [os.environ["STACK_NAME"]],
                      },
                      {
                          "Name": "tag:aws:cloudformation:logical-id",
                          "Values": ["DevelopmentInstance"],
                      },
                      {
                          "Name": "tag:Project",
                          "Values": [os.environ["PROJECT_TAG_VALUE"]],
                      },
                      {
                          "Name": "tag:Environment",
                          "Values": ["development"],
                      },
                      {
                          "Name": "tag:EnvironmentName",
                          "Values": [os.environ["ENVIRONMENT_NAME"]],
                      },
                      {
                          "Name": "instance-state-name",
                          "Values": ["running"],
                      },
                  ]
              )
              instance_ids = sorted(
                  instance["InstanceId"]
                  for reservation in response["Reservations"]
                  for instance in reservation["Instances"]
              )
              if instance_ids:
                  ec2.stop_instances(InstanceIds=instance_ids)
              return {"stopped_instance_count": len(instance_ids)}
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          PROJECT_TAG_VALUE: !Ref NotificationTagValue
          STACK_NAME: !Ref AWS::StackName
      Handler: index.handler
      MemorySize: 128
      Role: !GetAtt LeaseStopFunctionExecutionRole.Arn
      Runtime: python3.14
      Timeout: 30
      Tags:
        - Key: Name
          Value: workflow-control-center-development-stop-current-instance
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  SchedulerGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !If
        - IsPrimaryEnvironment
        - workflow-control-center-development
        - !Sub workflow-control-center-development-${EnvironmentName}
      Tags:
        - Key: Name
          Value: workflow-control-center-development
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  InstanceCreationGuardSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !If
        - IsPrimaryEnvironment
        - workflow-control-center-development-instance-creation-guard
        - !Sub workflow-control-center-${EnvironmentName}-instance-guard
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: !Ref ReplacementGuardScheduleExpression
      ScheduleExpressionTimezone: UTC
      State: !Ref ReplacementGuardScheduleState
      Target:
        Arn: !GetAtt LeaseStopFunction.Arn
        Input: '{}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3
        RoleArn: !GetAtt SchedulerExecutionRole.Arn

  DevelopmentHostLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: !Ref RootVolumeSizeGiB
              VolumeType: gp3
        IamInstanceProfile:
          Name: !Ref HostInstanceProfile
        ImageId: !If [IsAmd64, !Ref Amd64AmiId, !Ref Arm64AmiId]
        InstanceInitiatedShutdownBehavior: stop
        InstanceType: !Ref InstanceType
        MetadataOptions:
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
          HttpTokens: required
          InstanceMetadataTags: disabled
        Monitoring:
          Enabled: false
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            DeleteOnTermination: true
            DeviceIndex: 0
            Groups:
              - !Ref DevelopmentSecurityGroup
            SubnetId: !Ref DevelopmentSubnet
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !If
                  - IsPrimaryEnvironment
                  - workflow-control-center-development-root
                  - !Sub workflow-control-center-development-${EnvironmentName}-root
              - Key: Project
                Value: !Ref NotificationTagValue
              - Key: Environment
                Value: development
              - Key: EnvironmentName
                Value: !Ref EnvironmentName
              - Key: ManagedBy
                Value: CloudFormation
        UserData:
          Fn::Base64: !Sub
            - |
              #!/usr/bin/env bash
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              download_verified() {
                url="$1"
                sha256="$2"
                path="$3"
                tmp="$path.part"
                curl --fail --location --proto '=https' --show-error --silent \
                  --tlsv1.2 "$url" -o "$tmp"
                printf '%s  %s\n' "$sha256" "$tmp" \
                  | sha256sum --check --strict
                mv "$tmp" "$path"
              }

              apt-get update
              apt-get install --no-install-recommends -y ca-certificates curl ec2-instance-connect gnupg iptables jq openssh-server rsync tar unzip xfsprogs

              install -d -m 0755 /etc/workflow-control-center
              printf '%s\n' '${HostArtifactManifestSha256}' \
                > /etc/workflow-control-center/host-artifact-manifest.sha256
              printf '%s' '${HostArtifactManifestGzipBase64}' \
                > /etc/workflow-control-center/host-artifact-manifest.json.gz.b64
              manifest_path='/etc/workflow-control-center/host-artifact-manifest.json'
              printf '%s' '${HostArtifactManifestGzipBase64}' \
                | base64 --decode \
                | gzip --decompress \
                > "$manifest_path"
              chmod 0600 "$manifest_path"
              printf '%s  %s\n' '${HostArtifactManifestSha256}' \
                "$manifest_path" \
                | sha256sum --check --strict

              manifest_input="$(
                jq --exit-status --raw-output '
                  def artifact($name):
                    .artifact_by_name_map[$name] | .version, .url, .sha256;
                  .architecture,
                  .docker_signing_key_fingerprint,
                  .python_build,
                  artifact("aws-cli"),
                  artifact("docker-signing-key"),
                  artifact("containerd.io"),
                  artifact("docker-buildx-plugin"),
                  artifact("docker-ce"),
                  artifact("docker-ce-cli"),
                  artifact("uv"),
                  artifact("python"),
                  artifact("helm"),
                  artifact("k3s-binary")
                ' "$manifest_path" | sha256sum | awk '{print $1}'
              )"
              direct_input="$(
                printf '%s\n' \
                  '${ComputeArchitecture}' \
                  '${DockerSigningKeyFingerprint}' \
                  '${PythonBuild}' \
                  '${AwsCliVersion}' '${AwsCliUrl}' '${AwsCliSha256}' \
                  '${DockerSigningKeyFingerprint}' '${DockerSigningKeyUrl}' \
                  '${DockerSigningKeySha256}' \
                  '${DockerContainerdPackageVersion}' \
                  '${DockerContainerdPackageUrl}' '${DockerContainerdPackageSha256}' \
                  '${DockerBuildxPackageVersion}' '${DockerBuildxPackageUrl}' \
                  '${DockerBuildxPackageSha256}' \
                  '${DockerCePackageVersion}' '${DockerCePackageUrl}' \
                  '${DockerCePackageSha256}' \
                  '${DockerCeCliPackageVersion}' '${DockerCeCliPackageUrl}' \
                  '${DockerCeCliPackageSha256}' \
                  '${UvVersion}' '${UvUrl}' '${UvSha256}' \
                  '${PythonVersion}' '${PythonUrl}' '${PythonSha256}' \
                  '${HelmVersion}' '${HelmUrl}' '${HelmSha256}' \
                  '${K3sVersion}' '${K3sBinaryUrl}' '${K3sBinarySha256}' \
                  | sha256sum | awk '{print $1}'
              )"
              test "$manifest_input" = "$direct_input"

              download_verified '${AwsCliUrl}' '${AwsCliSha256}' /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              /tmp/aws/install
              /usr/local/bin/aws --version 2>&1 | grep -F "aws-cli/${AwsCliVersion} "
              rm -rf /tmp/aws /tmp/awscliv2.zip

              install -d -m 0755 /etc/apt/keyrings
              download_verified '${DockerSigningKeyUrl}' '${DockerSigningKeySha256}' \
                /etc/apt/keyrings/docker.asc
              chmod 0644 /etc/apt/keyrings/docker.asc
              install -d -m 0700 /tmp/docker-gpg
              GNUPGHOME=/tmp/docker-gpg gpg --batch --show-keys --with-colons \
                --fingerprint /etc/apt/keyrings/docker.asc \
                > /tmp/docker-key-colons
              docker_primary_key_count="$(
                awk -F: '$1 == "pub" {count++} END {print count + 0}' \
                  /tmp/docker-key-colons
              )"
              test "$docker_primary_key_count" = 1
              docker_signing_fingerprint="$(
                awk -F: '
                  $1 == "pub" {primary = 1; next}
                  primary && $1 == "fpr" {print $10; exit}
                ' /tmp/docker-key-colons
              )"
              test "$docker_signing_fingerprint" = '${DockerSigningKeyFingerprint}'

              download_verified '${DockerContainerdPackageUrl}' \
                '${DockerContainerdPackageSha256}' /tmp/containerd.io.deb
              download_verified '${DockerBuildxPackageUrl}' \
                '${DockerBuildxPackageSha256}' /tmp/docker-buildx-plugin.deb
              download_verified '${DockerCePackageUrl}' \
                '${DockerCePackageSha256}' /tmp/docker-ce.deb
              download_verified '${DockerCeCliPackageUrl}' \
                '${DockerCeCliPackageSha256}' /tmp/docker-ce-cli.deb
              apt-get install --no-install-recommends -y \
                /tmp/containerd.io.deb \
                /tmp/docker-buildx-plugin.deb \
                /tmp/docker-ce.deb \
                /tmp/docker-ce-cli.deb
              test "$(dpkg-query --show --showformat='${!Version}' containerd.io)" \
                = '${DockerContainerdPackageVersion}'
              test "$(dpkg-query --show --showformat='${!Version}' docker-buildx-plugin)" \
                = '${DockerBuildxPackageVersion}'
              test "$(dpkg-query --show --showformat='${!Version}' docker-ce)" \
                = '${DockerCePackageVersion}'
              test "$(dpkg-query --show --showformat='${!Version}' docker-ce-cli)" \
                = '${DockerCeCliPackageVersion}'
              systemctl enable --now containerd docker ssh

              download_verified '${UvUrl}' '${UvSha256}' /tmp/uv.tar.gz
              install -d -m 0755 /tmp/uv
              tar --extract --gzip --file /tmp/uv.tar.gz \
                --directory /tmp/uv --strip-components=1
              install -m 0755 /tmp/uv/uv /usr/local/bin/uv
              test "$(/usr/local/bin/uv --version | cut --delimiter=' ' --fields=1-2)" \
                = 'uv ${UvVersion}'

              download_verified '${PythonUrl}' '${PythonSha256}' /tmp/python.tar.gz
              python_root='/opt/python/cpython-${PythonVersion}+${PythonBuild}'
              install -d -m 0755 "$python_root"
              tar --extract --gzip --file /tmp/python.tar.gz \
                --directory "$python_root" --strip-components=1
              test "$("$python_root/bin/python3.14" \
                -c 'import platform; print(platform.python_version())')" \
                = '${PythonVersion}'
              ln -sfn "$python_root/bin/python3.14" /usr/local/bin/python3.14

              download_verified '${HelmUrl}' '${HelmSha256}' /tmp/helm.tar.gz
              install -d -m 0755 /tmp/helm
              tar --extract --gzip --file /tmp/helm.tar.gz \
                --directory /tmp/helm --strip-components=1
              install -m 0755 /tmp/helm/helm /usr/local/bin/helm
              test "$(/usr/local/bin/helm version --template '{{.Version}}')" \
                = '${HelmVersion}'

              volume_id='${RetainedVolumeId}'
              volume_serial="$(printf '%s' "$volume_id" | tr -d '-')"
              retained_device="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$volume_serial"
              for attempt in $(seq 1 180); do
                if [ -b "$retained_device" ]; then
                  break
                fi
                sleep 2
              done
              if [ ! -b "$retained_device" ]; then
                echo 'Retained EBS device did not appear.' >&2
                exit 1
              fi
              if ! blkid "$retained_device" >/dev/null 2>&1; then
                retained_device_size="$(blockdev --getsize64 "$retained_device")"
                if ! cmp --silent --bytes="$retained_device_size" \
                  "$retained_device" /dev/zero; then
                  echo 'Retained EBS device has data but no recognized filesystem.' >&2
                  exit 1
                fi
                mkfs.xfs "$retained_device"
              fi
              retained_uuid="$(blkid -s UUID -o value "$retained_device")"
              retained_root='${RetainedRootPath}'
              install -d -m 0755 "$retained_root"
              if ! grep -q "UUID=$retained_uuid " /etc/fstab; then
                printf 'UUID=%s %s xfs defaults,nofail,x-systemd.device-timeout=30 0 2\n' \
                  "$retained_uuid" "$retained_root" >> /etc/fstab
              fi
              mount "$retained_root"
              install -d -m 0750 \
                "$retained_root/glitchtip" \
                "$retained_root/observability" \
                "$retained_root/postgres" \
                "$retained_root/product-tool" \
                "$retained_root/release" \
                "$retained_root/secrets" \
                "$retained_root/workflow-registry" \
                "$retained_root/workflow-run"

              download_verified '${K3sBinaryUrl}' '${K3sBinarySha256}' /tmp/k3s
              install -m 0755 /tmp/k3s /usr/local/bin/k3s
              test "$(/usr/local/bin/k3s --version | awk 'NR == 1 {print $3}')" \
                = '${K3sVersion}'
              ln -sfn /usr/local/bin/k3s /usr/local/bin/kubectl
              ln -sfn /usr/local/bin/k3s /usr/local/bin/crictl
              ln -sfn /usr/local/bin/k3s /usr/local/bin/ctr
              install -d -m 0755 /etc/rancher/k3s
              cat > /etc/systemd/system/k3s.service <<'UNIT'
              [Unit]
              Description=Lightweight Kubernetes
              Documentation=https://k3s.io
              Wants=network-online.target
              After=network-online.target
              Conflicts=shutdown.target

              [Install]
              WantedBy=multi-user.target

              [Service]
              Type=notify
              Environment=KUBECONFIG=/etc/rancher/k3s/k3s.yaml
              KillMode=process
              Delegate=yes
              User=root
              LimitNOFILE=1048576
              LimitNPROC=infinity
              LimitCORE=infinity
              TasksMax=infinity
              TimeoutStartSec=0
              Restart=always
              RestartSec=5s
              ExecStartPre=-/sbin/modprobe br_netfilter
              ExecStartPre=-/sbin/modprobe overlay
              ExecStart=/usr/local/bin/k3s server \
                --cluster-cidr 10.42.0.0/16 \
                --service-cidr 10.43.0.0/16 \
                --disable traefik \
                --secrets-encryption \
                --write-kubeconfig-mode 0600 \
                --node-label apwid.com/workflow-run-eligible=true
              UNIT
              cat > /etc/systemd/system/workflow-control-center-imds-deny.service <<'UNIT'
              [Unit]
              Description=Deny Kubernetes pod access to EC2 instance metadata
              After=k3s.service
              Requires=k3s.service

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/bin/sh -c '/usr/sbin/iptables -C FORWARD -s 10.42.0.0/16 -d 169.254.169.254/32 -j REJECT || /usr/sbin/iptables -I FORWARD 1 -s 10.42.0.0/16 -d 169.254.169.254/32 -j REJECT'
              ExecStop=/bin/sh -c '/usr/sbin/iptables -D FORWARD -s 10.42.0.0/16 -d 169.254.169.254/32 -j REJECT || true'

              [Install]
              WantedBy=multi-user.target
              UNIT
              systemctl daemon-reload
              systemctl enable --now k3s workflow-control-center-imds-deny
              systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service 2>/dev/null \
                || systemctl enable --now amazon-ssm-agent
            - RetainedVolumeId: !If
                - UseRetainedVolumeBase
                - !Ref RetainedVolume
                - !If
                  - UseRetainedVolumeRestoreA
                  - !Ref RetainedVolumeRestoreA
                  - !Ref RetainedVolumeRestoreB
              RetainedRootPath: !If
                - IsPrimaryEnvironment
                - /srv/workflow-control-center
                - !Sub /srv/workflow-control-center-${EnvironmentName}
      LaunchTemplateName: !If
        - IsPrimaryEnvironment
        - workflow-control-center-development-host
        - !Sub workflow-control-center-development-${EnvironmentName}-host
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Name
              Value: !If
                - IsPrimaryEnvironment
                - workflow-control-center-development-host
                - !Sub workflow-control-center-development-${EnvironmentName}-host
            - Key: Project
              Value: !Ref NotificationTagValue
            - Key: Environment
              Value: development
            - Key: EnvironmentName
              Value: !Ref EnvironmentName
            - Key: ManagedBy
              Value: CloudFormation

  DevelopmentInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DevelopmentRoute
      - InstanceCreationGuardSchedule
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref DevelopmentHostLaunchTemplate
        Version: !Ref InstanceLaunchTemplateVersion
      Tags:
        - Key: Name
          Value: !If
            - IsPrimaryEnvironment
            - workflow-control-center-development
            - !Sub workflow-control-center-development-${EnvironmentName}
        - Key: Project
          Value: !Ref NotificationTagValue
        - Key: Environment
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: ReplacementSlot
          Value: !Ref InstanceSlot

  RetainedVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref DevelopmentInstance
      VolumeId: !If
        - UseRetainedVolumeBase
        - !Ref RetainedVolume
        - !If
          - UseRetainedVolumeRestoreA
          - !Ref RetainedVolumeRestoreA
          - !Ref RetainedVolumeRestoreB

Outputs:
  AccountId:
    Value: !Ref AWS::AccountId
  ComputeArchitecture:
    Value: !Ref ComputeArchitecture
  EnvironmentName:
    Value: !Ref EnvironmentName
  InstanceId:
    Value: !Ref DevelopmentInstance
  InstanceLaunchTemplateVersion:
    Value: !Ref InstanceLaunchTemplateVersion
  InstanceSlot:
    Value: !Ref InstanceSlot
  InstanceType:
    Value: !Ref InstanceType
  K3sVersion:
    Value: !Ref K3sVersion
  LatestLaunchTemplateVersion:
    Value: !GetAtt DevelopmentHostLaunchTemplate.LatestVersionNumber
  Region:
    Value: !Ref AWS::Region
  ReplacementGuardScheduleName:
    Value: !Ref InstanceCreationGuardSchedule
  RetainedVolumeId:
    Value: !If
      - UseRetainedVolumeBase
      - !Ref RetainedVolume
      - !If
        - UseRetainedVolumeRestoreA
        - !Ref RetainedVolumeRestoreA
        - !Ref RetainedVolumeRestoreB
  RetainedVolumeSlot:
    Value: !Ref RetainedVolumeSlot
  RetainedVolumeSourceSnapshotId:
    Value: !Ref RetainedVolumeSnapshotId
  SchedulerExecutionRoleArn:
    Value: !GetAtt SchedulerExecutionRole.Arn
  SchedulerGroupName:
    Value: !Ref SchedulerGroup
  StopLeaseTargetArn:
    Value: !GetAtt LeaseStopFunction.Arn
  SecurityGroupId:
    Value: !Ref DevelopmentSecurityGroup
  SubnetId:
    Value: !Ref DevelopmentSubnet
  VpcId:
    Value: !Ref DevelopmentVpc
