AWSTemplateFormatVersion: '2010-09-09'
Description: Development data plane in us-east-1.

Parameters:
  EnvironmentName:
    Type: String
    Default: primary
    AllowedPattern: '[a-z][a-z0-9]{0,15}'
    Description: Stable development environment identity.

  GitWorktree:
    Type: String
    Default: ''
    AllowedPattern: '(^$|^20[0-9]{2}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9-]*$)'
    MaxLength: 120
    Description: Exact task common prefix; empty only for primary.

  DeploymentPrincipalArn:
    Type: String
    Default: arn:aws:iam::463564115167:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_AdministratorAccess_96adc54d23890b23
    Description: Exact IAM Identity Center administrator role allowed to assume the platform role and administer Lake Formation.

  UiOrigin:
    Type: String
    Default: http://localhost:8080
    Description: Browser origin allowed to use direct S3 credentials.

  LocalHttpPort:
    Type: Number
    Default: 8080
    MinValue: 1024
    MaxValue: 65535
    Description: Account-unique local and remote SSM tunnel port reserved by this environment.

Conditions:
  IsPrimaryEnvironment: !Equals [!Ref EnvironmentName, primary]
  IsNonPrimaryEnvironment: !Not [!Condition IsPrimaryEnvironment]

Resources:
  HttpPortReservation:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /development/http-port/${LocalHttpPort}
      Type: String
      Value: !If
        - IsPrimaryEnvironment
        - primary
        - !Ref GitWorktree
      Description: Exact development environment that owns this SSM tunnel port.
      Tags:
        Name: !Sub http-port-${LocalHttpPort}
        EnvironmentClass: development
        EnvironmentName: !Ref EnvironmentName
        ManagedBy: CloudFormation

  LakeFormationDataAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - lake-formation-data-primary
        - !Sub lake-formation-data-${EnvironmentName}
      Description: Lake Formation access to encrypted Workflow Control Center development Data.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLakeFormation
            Effect: Allow
            Principal:
              Service: lakeformation.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: !Sub lake-formation-data-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  StorageKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Workflow Control Center development Data, Secret, and Result encryption.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowLakeFormationDataAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt LakeFormationDataAccessRole.Arn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Resource: '*'
            Condition:
              StringEquals:
                kms:EncryptionContext:aws:s3:arn: !If
                  - IsPrimaryEnvironment
                  - !Sub arn:${AWS::Partition}:s3:::${AWS::AccountId}-${AWS::Region}-primary-data
                  - !Sub arn:${AWS::Partition}:s3:::${AWS::AccountId}-${AWS::Region}-${EnvironmentName}-data
                kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}
      PendingWindowInDays: 7
      Tags:
        - Key: Name
          Value: !Sub storage-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  StorageKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !If
        - IsPrimaryEnvironment
        - alias/storage-primary
        - !Sub alias/storage-${EnvironmentName}
      TargetKeyId: !Ref StorageKmsKey

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - IsPrimaryEnvironment
        - !Sub ${AWS::AccountId}-${AWS::Region}-primary-data
        - !Sub ${AWS::AccountId}-${AWS::Region}-${EnvironmentName}-data
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt StorageKmsKey.Arn
              SSEAlgorithm: aws:kms
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - POST
              - PUT
            AllowedOrigins:
              - !Ref UiOrigin
            ExposedHeaders:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
              - x-amz-checksum-sha256
              - x-amz-version-id
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            Prefix: .platform/staging/
            Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub data-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      VersioningConfiguration:
        Status: Enabled

  SecretBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - IsPrimaryEnvironment
        - !Sub ${AWS::AccountId}-${AWS::Region}-primary-secret
        - !Sub ${AWS::AccountId}-${AWS::Region}-${EnvironmentName}-secret
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt StorageKmsKey.Arn
              SSEAlgorithm: aws:kms
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - POST
              - PUT
            AllowedOrigins:
              - !Ref UiOrigin
            ExposedHeaders:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
              - x-amz-checksum-sha256
              - x-amz-version-id
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            Prefix: .platform/staging/
            Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub secret-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      VersioningConfiguration:
        Status: Enabled

  ResultBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - IsPrimaryEnvironment
        - !Sub ${AWS::AccountId}-${AWS::Region}-primary-result
        - !Sub ${AWS::AccountId}-${AWS::Region}-${EnvironmentName}-result
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt StorageKmsKey.Arn
              SSEAlgorithm: aws:kms
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - !Ref UiOrigin
            ExposedHeaders:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
              - x-amz-checksum-sha256
              - x-amz-version-id
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            Prefix: athena-result/
            Status: Enabled
          - Id: ExpireDownloadsAfterTwoDays
            ExpirationInDays: 2
            NoncurrentVersionExpirationInDays: 2
            Prefix: data-download/
            Status: Enabled
          - Id: ExpireAthenaResultsAfterThirtyDays
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 30
            Prefix: athena-result/
            Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub result-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      VersioningConfiguration:
        Status: Enabled

  ObservabilityBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - IsPrimaryEnvironment
        - !Sub ${AWS::AccountId}-${AWS::Region}-primary-observability
        - !Sub ${AWS::AccountId}-${AWS::Region}-${EnvironmentName}-observability
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt StorageKmsKey.Arn
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteSourceMapUploads
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            Prefix: source-map/
            Status: Enabled
          - Id: ExpireSourceMapsAfterThirtyDays
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 30
            Prefix: source-map/
            Status: Enabled
          - Id: RemoveExpiredSourceMapDeleteMarkers
            ExpiredObjectDeleteMarker: true
            Prefix: source-map/
            Status: Enabled
          - Id: ExpireCloudFormationTemplatesAfterThirtyDays
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 30
            Prefix: cloudformation-template/
            Status: Enabled
          - Id: RemoveExpiredCloudFormationTemplateDeleteMarkers
            ExpiredObjectDeleteMarker: true
            Prefix: cloudformation-template/
            Status: Enabled
          - Id: ExpireAbandonedVpnValidationNonces
            ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            Prefix: vpn-validation/
            Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub observability-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
      VersioningConfiguration:
        Status: Enabled

  PlatformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - platform-primary
        - !Sub platform-${EnvironmentName}
      Description: Full Workflow Control Center control-plane access to its dedicated account.
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowDevelopmentAdministrator
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Ref DeploymentPrincipalArn
          - Sid: AllowDevelopmentCompute
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: !Sub platform-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  DataCredentialRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - data-credential-primary
        - !Sub data-credential-${EnvironmentName}
      Description: Tenant-tagged direct access to Workflow Control Center Data and Secret.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowTaggedPlatformSession
            Effect: Allow
            Principal:
              AWS: !GetAtt PlatformRole.Arn
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - UserDataRootId
              'Null':
                aws:RequestTag/UserDataRootId: 'false'
              StringLike:
                aws:RequestTag/UserDataRootId: '????????????????????????????????'
      Policies:
        - PolicyName: workflow-data-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StorageBucketLocations
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !GetAtt SecretBucket.Arn
                  - !GetAtt ResultBucket.Arn
              - Sid: DataBucketOwnerList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'user_${aws:PrincipalTag/UserDataRootId}'
                      - 'user_${aws:PrincipalTag/UserDataRootId}/*'
                      - '.platform/staging/user_${aws:PrincipalTag/UserDataRootId}'
                      - '.platform/staging/user_${aws:PrincipalTag/UserDataRootId}/*'
              - Sid: SecretBucketOwnerList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt SecretBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'user_${aws:PrincipalTag/UserDataRootId}/.secret'
                      - 'user_${aws:PrincipalTag/UserDataRootId}/.secret/*'
                      - '.platform/staging/user_${aws:PrincipalTag/UserDataRootId}'
                      - '.platform/staging/user_${aws:PrincipalTag/UserDataRootId}/*'
              - Sid: ResultBucketOwnerList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt ResultBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'athena-result/user_${aws:PrincipalTag/UserDataRootId}'
                      - 'athena-result/user_${aws:PrincipalTag/UserDataRootId}/*'
                      - 'data-download/user_${aws:PrincipalTag/UserDataRootId}'
                      - 'data-download/user_${aws:PrincipalTag/UserDataRootId}/*'
              - Sid: CanonicalDataObjectsRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectAttributes
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionAttributes
                Resource: !Sub '${DataBucket.Arn}/user_${!aws:PrincipalTag/UserDataRootId}/*'
              - Sid: CanonicalSecretObjectsRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectAttributes
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionAttributes
                Resource: !Sub '${SecretBucket.Arn}/user_${!aws:PrincipalTag/UserDataRootId}/.secret/*'
              - Sid: OwnerStagingObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:GetObjectAttributes
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionAttributes
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource:
                  - !Sub '${DataBucket.Arn}/.platform/staging/user_${!aws:PrincipalTag/UserDataRootId}/*'
                  - !Sub '${SecretBucket.Arn}/.platform/staging/user_${!aws:PrincipalTag/UserDataRootId}/*'
              - Sid: OwnerResultObjectsRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectAttributes
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionAttributes
                Resource:
                  - !Sub '${ResultBucket.Arn}/athena-result/user_${!aws:PrincipalTag/UserDataRootId}/*'
                  - !Sub '${ResultBucket.Arn}/data-download/user_${!aws:PrincipalTag/UserDataRootId}/*'
              - Sid: StorageKms
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt StorageKmsKey.Arn
                Condition:
                  StringEquals:
                    kms:EncryptionContext:aws:s3:arn:
                      - !GetAtt DataBucket.Arn
                      - !GetAtt SecretBucket.Arn
                      - !GetAtt ResultBucket.Arn
                    kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}
      Tags:
        - Key: Name
          Value: !Sub data-credential-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  QueryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - query-workflow-data-000-primary
        - !Sub query-workflow-data-000-${EnvironmentName}
      Description: Tenant-tagged Athena access for workflow_data_000.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowTaggedPlatformSession
            Effect: Allow
            Principal:
              AWS: !GetAtt PlatformRole.Arn
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - UserDataRootId
              'Null':
                aws:RequestTag/UserDataRootId: 'false'
              StringLike:
                aws:RequestTag/UserDataRootId: '????????????????????????????????'
      Policies:
        - PolicyName: workflow-data-query
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AthenaWorkgroup
                Effect: Allow
                Action:
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:GetWorkGroup
                  - athena:ListQueryExecutions
                  - athena:StartQueryExecution
                  - athena:StopQueryExecution
                Resource: !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}
              - Sid: GlueTenantMetadata
                Effect: Allow
                Action:
                  - glue:BatchGetPartition
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetTableVersion
                  - glue:GetTableVersions
                  - glue:SearchTables
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/user_${!aws:PrincipalTag/UserDataRootId}__*
              - Sid: LakeFormationDataAccess
                Effect: Allow
                Action: lakeformation:GetDataAccess
                Resource: '*'
              - Sid: ResultBucketLocation
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt ResultBucket.Arn
              - Sid: ResultBucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ResultBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'athena-result/user_${aws:PrincipalTag/UserDataRootId}'
                      - 'athena-result/user_${aws:PrincipalTag/UserDataRootId}/*'
              - Sid: ResultObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub '${ResultBucket.Arn}/athena-result/user_${!aws:PrincipalTag/UserDataRootId}/*'
              - Sid: ResultKms
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt StorageKmsKey.Arn
                Condition:
                  StringEquals:
                    kms:EncryptionContext:aws:s3:arn: !GetAtt ResultBucket.Arn
                    kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}
      Tags:
        - Key: Name
          Value: !Sub query-workflow-data-000-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: DataContract
          Value: athena-query

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub ${DataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyUnexpectedResourceAccount
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub ${DataBucket.Arn}/*
            Condition:
              StringNotEquals:
                s3:ResourceAccount: !Ref AWS::AccountId
          - Sid: DenyExplicitNonKmsEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${DataBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyUnexpectedKmsKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${DataBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-aws-kms-key-id: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt StorageKmsKey.Arn
          - Sid: DenyCustomerProvidedEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${DataBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-customer-algorithm: 'false'

  LakeFormationDataAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: lake-formation-data
      Roles:
        - !Ref LakeFormationDataAccessRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DataBucketReadWrite
            Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
            Resource: !Sub ${DataBucket.Arn}/*
          - Sid: DataBucketList
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: !GetAtt DataBucket.Arn
          - Sid: StorageKms
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Resource: !GetAtt StorageKmsKey.Arn
            Condition:
              StringEquals:
                kms:EncryptionContext:aws:s3:arn: !GetAtt DataBucket.Arn
                kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}

  SecretBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SecretBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SecretBucket.Arn
              - !Sub ${SecretBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyUnexpectedResourceAccount
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SecretBucket.Arn
              - !Sub ${SecretBucket.Arn}/*
            Condition:
              StringNotEquals:
                s3:ResourceAccount: !Ref AWS::AccountId
          - Sid: DenyExplicitNonKmsEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${SecretBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyUnexpectedKmsKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${SecretBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-aws-kms-key-id: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt StorageKmsKey.Arn
          - Sid: DenyCustomerProvidedEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${SecretBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-customer-algorithm: 'false'

  ResultBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResultBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ResultBucket.Arn
              - !Sub ${ResultBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyUnexpectedResourceAccount
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ResultBucket.Arn
              - !Sub ${ResultBucket.Arn}/*
            Condition:
              StringNotEquals:
                s3:ResourceAccount: !Ref AWS::AccountId
          - Sid: DenyExplicitNonKmsEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${ResultBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyUnexpectedKmsKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${ResultBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-aws-kms-key-id: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt StorageKmsKey.Arn
          - Sid: DenyCustomerProvidedEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${ResultBucket.Arn}/*
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-customer-algorithm: 'false'

