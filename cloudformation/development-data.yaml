  DataLakeLocation:
    Type: AWS::LakeFormation::Resource
    DependsOn:
      - DataBucketPolicy
      - LakeFormationDataAccessPolicy
    Properties:
      HybridAccessEnabled: false
      ResourceArn: !GetAtt DataBucket.Arn
      RoleArn: !GetAtt LakeFormationDataAccessRole.Arn
      UseServiceLinkedRole: false
      WithFederation: false

  NonPrimaryPlatformRoleCatalogPermission:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: IsNonPrimaryEnvironment
    # AWS EarlyValidation requires the Lake Formation Catalog union member to
    # be an object. cfn-lint 1.53.3 still carries the older string schema.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3012
    Properties:
      Permissions:
        - CREATE_DATABASE
      PermissionsWithGrantOption: []
      Principal:
        DataLakePrincipalIdentifier: !GetAtt PlatformRole.Arn
      Resource:
        Catalog: {}

  NonPrimaryPlatformRoleDataLocationPermission:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: IsNonPrimaryEnvironment
    DependsOn: DataLakeLocation
    Properties:
      Permissions:
        - DATA_LOCATION_ACCESS
      PermissionsWithGrantOption: []
      Principal:
        DataLakePrincipalIdentifier: !GetAtt PlatformRole.Arn
      Resource:
        DataLocation:
          CatalogId: !Ref AWS::AccountId
          ResourceArn: !GetAtt DataBucket.Arn

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        CreateTableDefaultPermissions: []
        Description: Shared tenant-isolated workflow Data tables
        Name: !If
          - IsPrimaryEnvironment
          - workflow_data_000
          - !Sub workflow_data_000_${EnvironmentName}
        Parameters:
          data-contract: athena-data

  PlatformRoleDatabasePermission:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: IsPrimaryEnvironment
    DependsOn: GlueDatabase
    Properties:
      Permissions:
        - ALL
      PermissionsWithGrantOption:
        - ALL
      Principal:
        DataLakePrincipalIdentifier: !GetAtt PlatformRole.Arn
      Resource:
        Database:
          CatalogId: !Ref AWS::AccountId
          Name: workflow_data_000

  NonPrimaryPlatformRoleDatabasePermission:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: IsNonPrimaryEnvironment
    Properties:
      Permissions:
        - ALL
      PermissionsWithGrantOption:
        - ALL
      Principal:
        DataLakePrincipalIdentifier: !GetAtt PlatformRole.Arn
      Resource:
        Database:
          CatalogId: !Ref AWS::AccountId
          Name: !Ref GlueDatabase

  UserATable:
    Type: AWS::Glue::Table
    DependsOn: DataLakeLocation
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Description: Source-declared workflow dataset projected from accepted Data manifests
        Name: user_11111111111141118111111111111111__acceptance__fixture__v1
        Parameters:
          classification: json
          EXTERNAL: 'TRUE'
          data-contract: athena-data
        PartitionKeys:
          - Name: workflow_run_date
            Type: string
        Retention: 0
        StorageDescriptor:
          Columns:
            - Name: value
              Type: string
          Compressed: false
          InputFormat: org.apache.hadoop.hive.ql.io.SymlinkTextInputFormat
          Location: !Sub s3://${DataBucket}/user_11111111111141118111111111111111/
          NumberOfBuckets: -1
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            Parameters:
              serialization.format: '1'
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
          StoredAsSubDirectories: false
        TableType: EXTERNAL_TABLE

  UserBTable:
    Type: AWS::Glue::Table
    DependsOn: DataLakeLocation
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Description: Source-declared workflow dataset projected from accepted Data manifests
        Name: user_22222222222242228222222222222222__acceptance__fixture__v1
        Parameters:
          classification: json
          EXTERNAL: 'TRUE'
          data-contract: athena-data
        PartitionKeys:
          - Name: workflow_run_date
            Type: string
        Retention: 0
        StorageDescriptor:
          Columns:
            - Name: value
              Type: string
          Compressed: false
          InputFormat: org.apache.hadoop.hive.ql.io.SymlinkTextInputFormat
          Location: !Sub s3://${DataBucket}/user_22222222222242228222222222222222/
          NumberOfBuckets: -1
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            Parameters:
              serialization.format: '1'
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
          StoredAsSubDirectories: false
        TableType: EXTERNAL_TABLE

  PlatformRoleTablePermission:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: IsPrimaryEnvironment
    DependsOn:
      - UserATable
      - UserBTable
    Properties:
      Permissions:
        - ALL
      PermissionsWithGrantOption:
        - ALL
      Principal:
        DataLakePrincipalIdentifier: !GetAtt PlatformRole.Arn
      Resource:
