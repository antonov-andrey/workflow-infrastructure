AWSTemplateFormatVersion: '2010-09-09'
Description: Development EC2 and k3s compute plane in us-east-1.

Parameters:
  EnvironmentName:
    Type: String
    Default: primary
    AllowedPattern: '[a-z][a-z0-9]{0,15}'
    Description: Stable development environment identity.

  GitWorktree:
    Type: String
    Default: ''
    AllowedPattern: '(^$|^20[0-9]{2}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9-]*$)'
    MaxLength: 120
    Description: Exact task common prefix; empty only for primary.

  Amd64AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Canonical Ubuntu 24.04 LTS amd64 AMI resolved at deployment time.

  Arm64AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
    Description: Canonical Ubuntu 24.04 LTS arm64 AMI resolved at deployment time.

  ComputeArchitecture:
    Type: String
    Default: arm64
    AllowedValues:
      - amd64
      - arm64
    Description: Architecture of the development compute instance and runtime platform.

  HostArtifactManifestGzipBase64:
    Type: String
    AllowedPattern: '[A-Za-z0-9+/=]+'
    MaxLength: 3072
    Description: Canonical compressed immutable host artifact provenance.

  HostArtifactManifestSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'
    Description: SHA-256 of canonical uncompressed host artifact provenance.

  HostBootstrapBundleSourceInfo:
    Type: String
    Description: Exact aws:downloadContent S3 source-info JSON for the content-addressed bootstrap bundle.

  HostBootstrapBundleSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'
    Description: SHA-256 of the exact bootstrap bundle archive.

  HostBootstrapManifestSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'
    Description: SHA-256 of the canonical manifest inside the bootstrap bundle.

  HostPythonArtifactSourceInfo:
    Type: String
    Description: Exact aws:downloadContent S3 source-info JSON for the Python 3.14 runtime archive.

  HostPythonArtifactSha256:
    Type: String
    AllowedPattern: '[0-9a-f]{64}'
    Description: SHA-256 of the exact Python 3.14 runtime archive.

  InstanceSlot:
    Type: String
    Default: a
    AllowedValues:
      - a
      - b
    Description: Alternating logical slot used for explicit replacement-instance recovery.

  InstanceLaunchTemplateVersion:
    Type: String
    Default: '1'
    AllowedPattern: '[1-9][0-9]*'
    Description: Exact launch-template version active on the current instance.

  InstanceType:
    Type: String
    Default: m7g.xlarge
    AllowedPattern: '[a-z0-9.]+'
    Description: Approved development compute instance type compatible with ComputeArchitecture.

  PlatformRoleName:
    Type: String
    Default: platform-primary
    AllowedPattern: '[A-Za-z0-9+=,.@_-]+'
    Description: Existing data-plane platform role attached to the EC2 instance profile.

  RetainedVolumeSizeGiB:
    Type: Number
    Default: 80
    MinValue: 80
    Description: Size of the encrypted retained Product state volume.

  RetainedVolumeSlot:
    Type: String
    Default: base
    AllowedValues:
      - base
      - a
      - b
    Description: Stable base volume or alternating restored-volume resource slot.

  RetainedVolumeSnapshotId:
    Type: String
    Default: ''
    AllowedPattern: '(^$|^snap-[0-9a-f]+$)'
    Description: Optional exact snapshot used to create a replacement retained volume.

  ReplacementGuardScheduleExpression:
    Type: String
    Default: at(2099-01-01T00:00:00)
    AllowedPattern: 'at\([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\)'
    Description: Exact UTC one-time expression used only while a new instance is being created.

  ReplacementGuardScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues:
      - DISABLED
      - ENABLED
    Description: Explicit replacement guard state; ordinary steady-state value is DISABLED.

  RootVolumeSizeGiB:
    Type: Number
    Default: 100
    MinValue: 100
    Description: Size of the encrypted disposable root and build-cache volume.

  S3GatewayEndpointEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'false'
      - 'true'
    Description: Whether to create the no-hourly-charge S3 gateway endpoint.

Rules:
  RetainedVolumeSourceIsConsistent:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - !Equals [!Ref RetainedVolumeSlot, base]
                - !Equals [!Ref RetainedVolumeSnapshotId, '']
            - Fn::And:
                - !Not [!Equals [!Ref RetainedVolumeSlot, base]]
                - !Not [!Equals [!Ref RetainedVolumeSnapshotId, '']]
        AssertDescription: The base slot has no snapshot and restored slots require one exact snapshot.

Conditions:
  HasGitWorktree: !Not [!Equals [!Ref GitWorktree, '']]
  IsAmd64: !Equals [!Ref ComputeArchitecture, amd64]
  IsPrimaryEnvironment: !Equals [!Ref EnvironmentName, primary]
  UseRetainedVolumeBase: !Equals [!Ref RetainedVolumeSlot, base]
  UseRetainedVolumeRestoreA: !Equals [!Ref RetainedVolumeSlot, a]
  UseRetainedVolumeRestoreB: !Equals [!Ref RetainedVolumeSlot, b]
  UseS3GatewayEndpoint: !Equals [!Ref S3GatewayEndpointEnabled, 'true']

Resources:
  DevelopmentInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub internet-gateway-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue

  DevelopmentInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref DevelopmentInternetGateway
      VpcId: !Ref DevelopmentVpc

  DevelopmentRoute:
    Type: AWS::EC2::Route
    DependsOn: DevelopmentInternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DevelopmentInternetGateway
      RouteTableId: !Ref DevelopmentRouteTable

  DevelopmentRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DevelopmentVpc
      Tags:
        - Key: Name
          Value: !Sub route-table-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue

  DevelopmentS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseS3GatewayEndpoint
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:*
            Resource: '*'
      RouteTableIds:
        - !Ref DevelopmentRouteTable
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      Tags:
        - Key: Name
          Value: !Sub s3-endpoint-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue
      VpcEndpointType: Gateway
      VpcId: !Ref DevelopmentVpc

  DevelopmentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress-only Workflow Control Center development compute.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Outbound package, image, AWS API, and Product traffic.
          IpProtocol: '-1'
      VpcId: !Ref DevelopmentVpc
      Tags:
        - Key: Name
          Value: !Sub security-group-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue

  DevelopmentSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.70.0.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref DevelopmentVpc
      Tags:
        - Key: Name
          Value: !Sub subnet-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue

  DevelopmentSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DevelopmentRouteTable
      SubnetId: !Ref DevelopmentSubnet

  DevelopmentVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.70.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub vpc-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue

  HostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !If
        - IsPrimaryEnvironment
        - platform-primary
        - !Sub platform-${EnvironmentName}
      Roles:
        - !Ref PlatformRoleName

  RetainedVolume:
    Type: AWS::EC2::Volume
    Condition: UseRetainedVolumeBase
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt DevelopmentSubnet.AvailabilityZone
      Encrypted: true
      Size: !Ref RetainedVolumeSizeGiB
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub retained-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue
        - !If
          - IsPrimaryEnvironment
          - Key: regular-backup
            Value: primary
          - !Ref AWS::NoValue

  RetainedVolumeRestoreA:
    Type: AWS::EC2::Volume
    Condition: UseRetainedVolumeRestoreA
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt DevelopmentSubnet.AvailabilityZone
      Encrypted: true
      Size: !Ref RetainedVolumeSizeGiB
      SnapshotId: !Ref RetainedVolumeSnapshotId
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub retained-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue
        - !If
          - IsPrimaryEnvironment
          - Key: regular-backup
            Value: primary
          - !Ref AWS::NoValue

  RetainedVolumeRestoreB:
    Type: AWS::EC2::Volume
    Condition: UseRetainedVolumeRestoreB
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt DevelopmentSubnet.AvailabilityZone
      Encrypted: true
      Size: !Ref RetainedVolumeSizeGiB
      SnapshotId: !Ref RetainedVolumeSnapshotId
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub retained-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue
        - !If
          - IsPrimaryEnvironment
          - Key: regular-backup
            Value: primary
          - !Ref AWS::NoValue

  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - scheduler-primary
        - !Sub scheduler-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: development-invoke-stop-lease
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt LeaseStopFunction.Arn
      Tags:
        - Key: Name
          Value: development-scheduler
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue

  LeaseStopFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !If
        - IsPrimaryEnvironment
        - /aws/lambda/stop-primary
        - !Sub /aws/lambda/stop-${EnvironmentName}
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: development-stop-current-instance
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue

  LeaseStopFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsPrimaryEnvironment
        - stop-primary
        - !Sub stop-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: development-stop-current-instance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ec2:ResourceTag/EnvironmentClass: development
                    ec2:ResourceTag/EnvironmentName: !Ref EnvironmentName
                    ec2:ResourceTag/ManagedBy: CloudFormation
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LeaseStopFunctionLogGroup.Arn
      Tags:
        - Key: Name
          Value: development-stop-current-instance
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue

  LeaseStopFunction:
    Type: AWS::Lambda::Function
    DependsOn: LeaseStopFunctionLogGroup
    Properties:
      FunctionName: !If
        - IsPrimaryEnvironment
        - stop-primary
        - !Sub stop-${EnvironmentName}
      Architectures:
        - arm64
      Code:
        ZipFile: |
          import os

          import boto3


          def handler(event, context):
              del event, context
              ec2 = boto3.client("ec2")
              response = ec2.describe_instances(
                  Filters=[
                      {
                          "Name": "tag:aws:cloudformation:stack-name",
                          "Values": [os.environ["STACK_NAME"]],
                      },
                      {
                          "Name": "tag:aws:cloudformation:logical-id",
                          "Values": ["DevelopmentInstance"],
                      },
                      {
                          "Name": "tag:EnvironmentClass",
                          "Values": ["development"],
                      },
                      {
                          "Name": "tag:EnvironmentName",
                          "Values": [os.environ["ENVIRONMENT_NAME"]],
                      },
                      {
                          "Name": "instance-state-name",
                          "Values": ["running"],
                      },
                  ]
              )
              instance_ids = sorted(
                  instance["InstanceId"]
                  for reservation in response["Reservations"]
                  for instance in reservation["Instances"]
              )
              if instance_ids:
                  ec2.stop_instances(InstanceIds=instance_ids)
              return {"stopped_instance_count": len(instance_ids)}
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          STACK_NAME: !Ref AWS::StackName
      Handler: index.handler
      MemorySize: 128
      Role: !GetAtt LeaseStopFunctionExecutionRole.Arn
      Runtime: python3.14
      Timeout: 30
      Tags:
        - Key: Name
          Value: development-stop-current-instance
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue

  SchedulerGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !If
        - IsPrimaryEnvironment
        - scheduler-primary
        - !Sub scheduler-${EnvironmentName}
      Tags:
        - Key: Name
          Value: development
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue

  InstanceCreationGuardSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !If
        - IsPrimaryEnvironment
        - guard-primary
        - !Sub guard-${EnvironmentName}
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: !Ref ReplacementGuardScheduleExpression
      ScheduleExpressionTimezone: UTC
      State: !Ref ReplacementGuardScheduleState
      Target:
        Arn: !GetAtt LeaseStopFunction.Arn
        Input: '{}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3
        RoleArn: !GetAtt SchedulerExecutionRole.Arn

  HostBootstrapDocument:
    Type: AWS::SSM::Document
    Metadata:
      HostArtifactManifestGzipBase64: !Ref HostArtifactManifestGzipBase64
      HostArtifactManifestSha256: !Ref HostArtifactManifestSha256
    Properties:
      Content:
        schemaVersion: '2.2'
        description: Install one exact content-addressed development host release.
        parameters:
          Architecture:
            type: String
            allowedPattern: '^(amd64|arm64)$'
          EnvironmentName:
            type: String
            allowedPattern: '^[a-z][a-z0-9]{0,15}$'
          RetainedRootPath:
            type: String
            allowedPattern: '^/srv/workflow-control-center(-w[0-9a-f]{15})?$'
          RetainedVolumeId:
            type: String
            allowedPattern: '^vol-[0-9a-f]+$'
        mainSteps:
          - action: aws:downloadContent
            name: downloadPythonRuntime
            inputs:
              destinationPath: /var/lib/development-bootstrap/download/python.tar.gz
              sourceInfo: !Ref HostPythonArtifactSourceInfo
              sourceType: S3
          - action: aws:downloadContent
            name: downloadBootstrapBundle
            inputs:
              destinationPath: /var/lib/development-bootstrap/download/bootstrap.tar.gz
              sourceInfo: !Ref HostBootstrapBundleSourceInfo
              sourceType: S3
          - action: aws:runShellScript
            name: runVerifiedBootstrap
            inputs:
              timeoutSeconds: '3600'
              runCommand:
                - !Sub |
                    set -eu
                    umask 077
                    root=/var/lib/development-bootstrap
                    python_archive="$root/download/python.tar.gz"
                    bundle_archive="$root/download/bootstrap.tar.gz"
                    printf '%s  %s\n' '${HostPythonArtifactSha256}' "$python_archive" | sha256sum --check --strict
                    printf '%s  %s\n' '${HostBootstrapBundleSha256}' "$bundle_archive" | sha256sum --check --strict
                    python_root="/opt/python/bootstrap-${HostPythonArtifactSha256}"
                    bundle_root="$root/release/${HostBootstrapBundleSha256}"
                    if [ ! -x "$python_root/bin/python3.14" ]; then
                      python_new="$python_root.new"
                      rm -rf "$python_root"
                      rm -rf "$python_new"
                      install -d -m 0755 "$python_new"
                      tar --extract --gzip --file "$python_archive" --directory "$python_new" --strip-components=1
                      mv "$python_new" "$python_root"
                    fi
                    if [ ! -x "$bundle_root/host_bootstrap.py" ]; then
                      bundle_new="$bundle_root.new"
                      rm -rf "$bundle_root"
                      rm -rf "$bundle_new"
                      install -d -m 0755 "$bundle_new"
                      tar --extract --gzip --file "$bundle_archive" --directory "$bundle_new"
                      mv "$bundle_new" "$bundle_root"
                    fi
                    exec "$python_root/bin/python3.14" -B "$bundle_root/host_bootstrap.py" \
                      --architecture '{{ Architecture }}' \
                      --bundle-root "$bundle_root" \
                      --bundle-manifest-sha256 '${HostBootstrapManifestSha256}' \
                      --environment-name '{{ EnvironmentName }}' \
                      --python-runtime "$python_root" \
                      --retained-root '{{ RetainedRootPath }}' \
                      --retained-volume-id '{{ RetainedVolumeId }}'
      DocumentFormat: YAML
      DocumentType: Command
      Name: !Sub bootstrap-${EnvironmentName}
      TargetType: /AWS::EC2::Instance
      UpdateMethod: NewVersion
      VersionName: !Sub b-${HostBootstrapBundleSha256}
      Tags:
        - Key: Name
          Value: !Sub bootstrap-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue

  DevelopmentHostLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: !Ref RootVolumeSizeGiB
              VolumeType: gp3
        IamInstanceProfile:
          Name: !Ref HostInstanceProfile
        ImageId: !If [IsAmd64, !Ref Amd64AmiId, !Ref Arm64AmiId]
        InstanceInitiatedShutdownBehavior: stop
        InstanceType: !Ref InstanceType
        MetadataOptions:
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
          HttpTokens: required
          InstanceMetadataTags: disabled
        Monitoring:
          Enabled: false
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            DeleteOnTermination: true
            DeviceIndex: 0
            Groups:
              - !Ref DevelopmentSecurityGroup
            SubnetId: !Ref DevelopmentSubnet
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub root-${EnvironmentName}
              - Key: EnvironmentClass
                Value: development
              - Key: EnvironmentName
                Value: !Ref EnvironmentName
              - Key: ManagedBy
                Value: CloudFormation
              - !If
                - HasGitWorktree
                - Key: git-worktree
                  Value: !Ref GitWorktree
                - !Ref AWS::NoValue
        UserData:
          Fn::Base64: |
            #!/usr/bin/env bash
            set -euo pipefail
            if systemctl list-unit-files amazon-ssm-agent.service >/dev/null 2>&1; then
              systemctl enable --now amazon-ssm-agent.service
            elif systemctl list-unit-files snap.amazon-ssm-agent.amazon-ssm-agent.service >/dev/null 2>&1; then
              systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service
            else
              echo 'The selected AMI does not provide the required Amazon SSM Agent.' >&2
              exit 1
            fi
      LaunchTemplateName: !If
        - IsPrimaryEnvironment
        - host-primary
        - !Sub host-${EnvironmentName}
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Name
              Value: !Sub host-${EnvironmentName}
            - Key: EnvironmentClass
              Value: development
            - Key: EnvironmentName
              Value: !Ref EnvironmentName
            - Key: ManagedBy
              Value: CloudFormation
            - !If
              - HasGitWorktree
              - Key: git-worktree
                Value: !Ref GitWorktree
              - !Ref AWS::NoValue

  DevelopmentInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DevelopmentRoute
      - InstanceCreationGuardSchedule
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref DevelopmentHostLaunchTemplate
        Version: !Ref InstanceLaunchTemplateVersion
      Tags:
        - Key: Name
          Value: !Sub host-${EnvironmentName}
        - Key: EnvironmentClass
          Value: development
        - Key: EnvironmentName
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - !If
          - HasGitWorktree
          - Key: git-worktree
            Value: !Ref GitWorktree
          - !Ref AWS::NoValue
        - Key: ReplacementSlot
          Value: !Ref InstanceSlot

  RetainedVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref DevelopmentInstance
      VolumeId: !If
        - UseRetainedVolumeBase
        - !Ref RetainedVolume
        - !If
          - UseRetainedVolumeRestoreA
          - !Ref RetainedVolumeRestoreA
          - !Ref RetainedVolumeRestoreB

Outputs:
  AccountId:
    Value: !Ref AWS::AccountId
  ComputeArchitecture:
    Value: !Ref ComputeArchitecture
  HostBootstrapDocumentName:
    Value: !Ref HostBootstrapDocument
  EnvironmentName:
    Value: !Ref EnvironmentName
  InstanceId:
    Value: !Ref DevelopmentInstance
  InstanceLaunchTemplateVersion:
    Value: !Ref InstanceLaunchTemplateVersion
  InstanceSlot:
    Value: !Ref InstanceSlot
  InstanceType:
    Value: !Ref InstanceType
  LatestLaunchTemplateVersion:
    Value: !GetAtt DevelopmentHostLaunchTemplate.LatestVersionNumber
  Region:
    Value: !Ref AWS::Region
  ReplacementGuardScheduleName:
    Value: !Ref InstanceCreationGuardSchedule
  RetainedVolumeId:
    Value: !If
      - UseRetainedVolumeBase
      - !Ref RetainedVolume
      - !If
        - UseRetainedVolumeRestoreA
        - !Ref RetainedVolumeRestoreA
        - !Ref RetainedVolumeRestoreB
  RetainedVolumeSlot:
    Value: !Ref RetainedVolumeSlot
  RetainedVolumeSourceSnapshotId:
    Value: !Ref RetainedVolumeSnapshotId
  SchedulerExecutionRoleArn:
    Value: !GetAtt SchedulerExecutionRole.Arn
  SchedulerGroupName:
    Value: !Ref SchedulerGroup
  StopLeaseTargetArn:
    Value: !GetAtt LeaseStopFunction.Arn
  SecurityGroupId:
    Value: !Ref DevelopmentSecurityGroup
  SubnetId:
    Value: !Ref DevelopmentSubnet
  VpcId:
    Value: !Ref DevelopmentVpc
